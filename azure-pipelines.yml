trigger:
- none

pool:
  vmImage: 'ubuntu-latest'

parameters:
- name: action
  displayName: "Select Action"
  type: string
  default: apply
  values:
  - apply
  - destroy

variables:
- group: terraform-bootstrap-vars

stages:
- stage: Terraform
  displayName: "Terraform Stage"

  jobs:
  - job: TerraformJob
    displayName: "Terraform Execution"

    steps:

    # Install Terraform
    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: '1.5.0'

    # Terraform Init
    - task: TerraformTaskV4@4
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        environmentServiceNameAzureRM: 'terraform_bootstarp'

    # Terraform Format Check
    - script: terraform fmt -check
      displayName: "Terraform Format Check"
      condition: eq('${{ parameters.action }}', 'apply')

    # Terraform Validate
    - task: TerraformTaskV4@4
      displayName: "Terraform Validate"
      inputs:
        provider: 'azurerm'
        command: 'validate'
      condition: eq('${{ parameters.action }}', 'apply')

    # Terraform Plan
    - task: TerraformTaskV4@4
      displayName: "Terraform Plan"
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'terraform_bootstarp'
        commandOptions: >
          -var "resource_group_name=$(resource_group_name)"
          -var "location=$(location)"
          -var "environment=$(environment)"
          -var "storage_account_name=$(storage_account_name)"
          -var "container_name=$(container_name)"
          -var "key_vault_name=$(key_vault_name)"
          -out=tfplan
      condition: eq('${{ parameters.action }}', 'apply')

    # Terraform Apply
    - task: TerraformTaskV4@4
      displayName: "Terraform Apply"
      inputs:
        provider: 'azurerm'
        command: 'apply'
        environmentServiceNameAzureRM: 'terraform_bootstarp'
        commandOptions: 'tfplan'
      condition: eq('${{ parameters.action }}', 'apply')

    # Terraform Destroy
    - task: TerraformTaskV4@4
      displayName: "Terraform Destroy"
      inputs:
        provider: 'azurerm'
        command: 'destroy'
        environmentServiceNameAzureRM: 'terraform_bootstarp'
        commandOptions: >
          -auto-approve
          -var "resource_group_name=$(resource_group_name)"
          -var "location=$(location)"
          -var "environment=$(environment)"
          -var "storage_account_name=$(storage_account_name)"
          -var "container_name=$(container_name)"
          -var "key_vault_name=$(key_vault_name)"
      condition: eq('${{ parameters.action }}', 'destroy')
trigger:
- none

pool:
  vmImage: 'ubuntu-latest'

# 🔹 Parameter to choose action
parameters:
- name: action
  displayName: "Select Action"
  type: string
  default: apply
  values:
  - apply
  - destroy

variables:
- group: terraform-bootstrap-vars

stages:
- stage: Terraform
  displayName: "Terraform Stage"

  jobs:
  - job: TerraformJob
    displayName: "Terraform Execution"

    steps:

    # 🔐 Azure Login using Service Connection
    - task: AzureCLI@2
      displayName: "Azure Login"
      inputs:
        azureSubscription: 'terraform_bootstarp'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az account show

    # 📦 Install Terraform
    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: '1.5.0'

    # 🚀 Terraform Init
    - script: |
        terraform init
      displayName: "Terraform Init"

    # ✅ Terraform Format Check
    - script: |
        terraform fmt -check
      displayName: "Terraform Format Check"
      condition: eq('${{ parameters.action }}', 'apply')

    # ✅ Terraform Validate
    - script: |
        terraform validate
      displayName: "Terraform Validate"
      condition: eq('${{ parameters.action }}', 'apply')

    # 📊 Terraform Plan
    - script: |
        terraform plan \
        -var "resource_group_name=$(resource_group_name)" \
        -var "location=$(location)" \
        -var "environment=$(environment)" \
        -var "storage_account_name=$(storage_account_name)" \
        -var "container_name=$(container_name)" \
        -var "key_vault_name=$(key_vault_name)" \
        -out=tfplan
      displayName: "Terraform Plan"
      condition: eq('${{ parameters.action }}', 'apply')

    # 🚀 Terraform Apply
    - script: |
        terraform apply -auto-approve tfplan
      displayName: "Terraform Apply"
      condition: eq('${{ parameters.action }}', 'apply')

    # 💣 Terraform Destroy
    - script: |
        terraform destroy -auto-approve \
        -var "resource_group_name=$(resource_group_name)" \
        -var "location=$(location)" \
        -var "environment=$(environment)" \
        -var "storage_account_name=$(storage_account_name)" \
        -var "container_name=$(container_name)" \
        -var "key_vault_name=$(key_vault_name)"
      displayName: "Terraform Destroy"
      condition: eq('${{ parameters.action }}', 'destroy')
trigger:
- none

pool:
  vmImage: 'ubuntu-latest'

# 🔹 Select Action
parameters:
- name: action
  displayName: "Select Action"
  type: string
  default: apply
  values:
  - apply
  - destroy

# 🔹 Variable Group
variables:
- group: terraform-bootstrap-vars

stages:
- stage: Terraform
  displayName: "Terraform Bootstrap Stage"

  jobs:
  - job: TerraformJob
    displayName: "Terraform Execution"

    steps:

    # 📦 Install Terraform
    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: '1.5.0'

    # 🔽 Download Existing State Before Destroy
    - task: DownloadPipelineArtifact@2
      displayName: "Download Terraform State"
      inputs:
        artifact: 'tfstate'
        path: '$(System.DefaultWorkingDirectory)'
      condition: eq('${{ parameters.action }}', 'destroy')

    # 🚀 Terraform Init (LOCAL STATE)
    - task: TerraformTaskV4@4
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'

    # ✅ Terraform Format Check
    - script: terraform fmt -check
      displayName: "Terraform Format Check"
      condition: eq('${{ parameters.action }}', 'apply')

    # ✅ Terraform Validate
    - task: TerraformTaskV4@4
      displayName: "Terraform Validate"
      inputs:
        provider: 'azurerm'
        command: 'validate'
      condition: eq('${{ parameters.action }}', 'apply')

    # 📊 Terraform Plan
    - task: TerraformTaskV4@4
      displayName: "Terraform Plan"
      inputs:
        provider: 'azurerm'
        command: 'plan'

        environmentServiceNameAzureRM: 'terraform_bootstarp'

        commandOptions: >
          -var "resource_group_name=$(resource_group_name)"
          -var "location=$(location)"
          -var "environment=$(environment)"
          -var "storage_account_name=$(storage_account_name)"
          -var "container_name=$(container_name)"
          -var "key_vault_name=$(key_vault_name)"
          -out=tfplan
      condition: eq('${{ parameters.action }}', 'apply')

    # 🚀 Terraform Apply
    - task: TerraformTaskV4@4
      displayName: "Terraform Apply"
      inputs:
        provider: 'azurerm'
        command: 'apply'

        environmentServiceNameAzureRM: 'terraform_bootstarp'

        commandOptions: 'tfplan'
      condition: eq('${{ parameters.action }}', 'apply')

    # 📤 Upload State After Apply
    - task: PublishPipelineArtifact@1
      displayName: "Publish Terraform State"
      inputs:
        targetPath: 'terraform.tfstate'
        artifact: 'tfstate'
      condition: eq('${{ parameters.action }}', 'apply')

    # 💣 Terraform Destroy
    - task: TerraformTaskV4@4
      displayName: "Terraform Destroy"
      inputs:
        provider: 'azurerm'
        command: 'destroy'

        environmentServiceNameAzureRM: 'terraform_bootstarp'

        commandOptions: >
          -auto-approve
          -var "resource_group_name=$(resource_group_name)"
          -var "location=$(location)"
          -var "environment=$(environment)"
          -var "storage_account_name=$(storage_account_name)"
          -var "container_name=$(container_name)"
          -var "key_vault_name=$(key_vault_name)"
      condition: eq('${{ parameters.action }}', 'destroy')